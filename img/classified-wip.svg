<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="'Courier New', Courier, monospace">
  <defs>
    <filter id="glowq">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="#080808"/>

  <!-- Faint grid -->
  <g stroke="#0f2a16" stroke-width="1" opacity="0.6">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Top label -->
  <text x="320" y="58" text-anchor="middle" fill="#2a8a3e" font-size="13" letter-spacing="3">// PROJECT_CLASSIFIED</text>

  <!-- Big glowing ? -->
  <text x="320" y="225" text-anchor="middle" fill="#00ff41" font-size="170" font-weight="bold" filter="url(#glowq)">?</text>

  <!-- Redacted bars -->
  <g fill="#143620">
    <rect x="150" y="262" width="150" height="14" rx="2"/>
    <rect x="312" y="262" width="100" height="14" rx="2"/>
    <rect x="424" y="262" width="66" height="14" rx="2"/>
    <rect x="180" y="284" width="90" height="14" rx="2"/>
    <rect x="282" y="284" width="178" height="14" rx="2"/>
  </g>

  <!-- WIP banner -->
  <rect x="232" y="322" width="176" height="34" rx="3" fill="none" stroke="#00ff41" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="320" y="344" text-anchor="middle" fill="#00ff41" font-size="14" font-weight="bold" letter-spacing="2">[ WIP ]</text>

  <!-- Footer note -->
  <text x="320" y="384" text-anchor="middle" fill="#2a8a3e" font-size="10" letter-spacing="1">access restricted - title under NDA</text>
</svg>
